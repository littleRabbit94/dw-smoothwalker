; Settings page for the Dawnwalker Mod Menu (Nexus 271). The menu reads this file; DWSmoothCam does not.
; Apply rewrites the matching numbers in scripts/config/smoothcam.ini, and the mod picks the change up
; within a quarter second: no callback needed.
;
; Only numeric keys can go here, so toggle_key and preset_key are missing. Every ConfigKey below must
; exist exactly once in smoothcam.ini with a value inside its range, or the whole page fails to open.

[Mod]
Id = DWSmoothCam
Name = SmoothCam
Author = littleRabbit6
Version = 0.6.0
Description = A smoother third-person camera. The camera trails your character instead of being locked to it, while turning stays instant. O switches it on and off, V cycles presets. Changes apply as soon as you press Apply.

[Setting.enabled]
Id = enabled
Type = toggle
Label = SmoothCam
Description = On: the camera follows your character smoothly. Off: the game's own camera. O switches this in game.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = enabled

[Setting.preset_load]
Id = preset_load
Type = picker
Label = Load preset
Description = Tight: barely trails. Balanced: a clear trail that settles fast (the default). Cinematic: a heavy, slow trail with smoothed turning. Pick one and press Apply. Reopen this page afterwards to see the new values on the sliders. An empty slot loads nothing.
Group = Presets
PresetValues = 0|101|102|103|1|2|3|4|5|6
PresetLabels = None|Tight|Balanced|Cinematic|Slot 1|Slot 2|Slot 3|Slot 4|Slot 5|Slot 6
Default = 0
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = preset_load

[Setting.preset_save]
Id = preset_save
Type = picker
Label = Save current settings to
Description = Pick a slot and press Apply to save the Follow and Rotation settings there. V cycles Tight, Balanced, Cinematic and your saved slots in game, and a banner names each one.
Group = Presets
PresetValues = 0|1|2|3|4|5|6
PresetLabels = None|Slot 1|Slot 2|Slot 3|Slot 4|Slot 5|Slot 6
Default = 0
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = preset_save

[Setting.follow_rate_h]
Id = follow_rate_h
Type = slider
Label = Horizontal follow speed
Description = How quickly the camera catches up as you move sideways and forwards. Lower is floatier.
Group = Follow
Minimum = 0.5
Maximum = 30
Step = 0.5
Decimals = 1
Default = 8
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = follow_rate_h

[Setting.curve_h]
Id = curve_h
Type = picker
Label = Horizontal catch-up curve
Description = How the catch-up speed changes with distance. Constant keeps one speed. The others start gently and speed up as the camera falls further behind.
Group = Follow
PresetValues = 0|1|2|3
PresetLabels = Constant|Linear|Smoothstep|Ease in-out
Default = 2
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = curve_h

[Setting.max_lag_h]
Id = max_lag_h
Type = integer
Label = Horizontal lag limit
Description = The furthest the camera may fall behind horizontally.
Group = Follow
Minimum = 0
Maximum = 300
Step = 5
Decimals = 0
Default = 70
Suffix = cm
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = max_lag_h

[Setting.follow_rate_v]
Id = follow_rate_v
Type = slider
Label = Vertical follow speed
Description = How quickly the camera catches up when you jump, fall or climb.
Group = Follow
Minimum = 0.5
Maximum = 30
Step = 0.5
Decimals = 1
Default = 10
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = follow_rate_v

[Setting.curve_v]
Id = curve_v
Type = picker
Label = Vertical catch-up curve
Description = How the vertical catch-up speed changes with distance.
Group = Follow
PresetValues = 0|1|2|3
PresetLabels = Constant|Linear|Smoothstep|Ease in-out
Default = 0
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = curve_v

[Setting.max_lag_v]
Id = max_lag_v
Type = integer
Label = Vertical lag limit
Description = The furthest the camera may fall behind vertically.
Group = Follow
Minimum = 0
Maximum = 200
Step = 5
Decimals = 0
Default = 50
Suffix = cm
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = max_lag_v

[Setting.soft_leash]
Id = soft_leash
Type = toggle
Label = Soft lag limit
Description = On: the camera eases into the lag limit. Off: it stops hard at the limit, which can feel rigid at a steady run.
Group = Follow
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = soft_leash

[Setting.catchup_distance]
Id = catchup_distance
Type = integer
Label = Full-speed distance
Description = For the non-constant curves: how far behind the camera must be before it catches up at full speed.
Group = Follow
Minimum = 10
Maximum = 500
Step = 10
Decimals = 0
Default = 150
Suffix = cm
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = catchup_distance

[Setting.min_rate_scale]
Id = min_rate_scale
Type = slider
Label = Gentle-start strength
Description = For the non-constant curves: the catch-up speed when the camera is barely behind, as a share of the full speed. Lower is floatier.
Group = Follow
Minimum = 0.05
Maximum = 1
Step = 0.05
Decimals = 2
Default = 0.35
Prefix = x
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = min_rate_scale

[Setting.rotation_smoothing]
Id = rotation_smoothing
Type = toggle
Label = Smooth turning
Description = On: turning the camera is smoothed too. This adds a little delay to aiming. Off: turning follows your input exactly.
Group = Rotation
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = rotation_smoothing

[Setting.rotation_rate]
Id = rotation_rate
VisibleWhen = rotation_smoothing
VisibleValues = 1
Type = slider
Label = Turning follow speed
Description = How quickly smoothed turning catches up with your input. Higher is more responsive.
Group = Rotation
Minimum = 1
Maximum = 60
Step = 1
Decimals = 0
Default = 20
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = rotation_rate

[Setting.wall_clamp]
Id = wall_clamp
Type = toggle
Label = Stay in front of walls
Description = On: when the game pulls the camera in for a wall, the smoothed camera stays in front of it too. Off: the lag can carry the camera into the wall.
Group = Safety
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = wall_clamp

[Setting.reset_distance]
Id = reset_distance
Type = integer
Label = Teleport distance
Description = A jump this far in one frame counts as a teleport, and the camera snaps to your character instead of gliding.
Group = Safety
Minimum = 100
Maximum = 3000
Step = 50
Decimals = 0
Default = 500
Suffix = cm
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = reset_distance

[Setting.reset_gap]
Id = reset_gap
Type = slider
Label = Snap after a pause of
Description = After cutscenes, the free camera or a load, the camera snaps back instead of gliding if it has been away this long.
Group = Safety
Minimum = 0.05
Maximum = 2
Step = 0.05
Decimals = 2
Default = 0.25
Suffix = s
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = reset_gap

[Setting.show_banner]
Id = show_banner
Type = toggle
Label = Show banners
Description = On: loading or cycling a preset, saving a slot, or pressing O shows a short banner at the top of the screen. Off: no banners.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = show_banner

[Setting.log_stats]
Id = log_stats
Type = toggle
Label = Log statistics
Description = Writes smoothing statistics to UE4SS.log every 5 seconds. For troubleshooting.
Group = Debug
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = scripts/config/smoothcam.ini
ConfigKey = log_stats
