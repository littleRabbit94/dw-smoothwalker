; DWSmoothCam settings. The Dawnwalker Mod Menu edits the numbers below, and the mod applies a saved change
; within a quarter second. The mod writes shoulder and preset key changes back here while you play.
; The key names are read when the game starts. Leave one blank for no key.
; Keys this game leaves unbound: H K N O U V Y. P, F5 and F9 are used by the game.
; DWFreeCam uses F6 F7 H, DWTimeOfDay U Y H K.

enabled          = 1     ; 0 turns the follow smoothing off; camera position has its own switch below
toggle_key       =       ; switches smoothing on and off in game (blank: use enabled or the Mod Menu)
preset_key       =       ; cycles Tight, Balanced, Cinematic, your saved slots, then the presets folder
shoulder_key     = V     ; switches the camera to the other shoulder

; Follow: how the camera trails your character. Rates are per second: higher is tighter.
follow_rate_h    = 8     ; horizontal catch-up rate
follow_rate_v    = 10    ; vertical catch-up rate
curve_h          = 2     ; 0 exponential, 1 linear, 2 smoothstep, 3 ease in-out
curve_v          = 0
catchup_distance = 150   ; cm of lag at which a curve reaches the full rate
min_rate_scale   = 0.35  ; rate multiplier at zero lag for curves 1-3
max_lag_h        = 70    ; cm the camera may fall behind horizontally
max_lag_v        = 50    ; cm vertically
soft_leash       = 1     ; 1 eases into the limit, 0 stops hard at it
aiming_follow    = 30    ; percent of the trail and the turning smoothing kept while you aim: 0 none, 100 all

; Rotation smoothing adds input lag to aiming; off by default.
rotation_smoothing = 0
rotation_rate      = 20

wall_clamp       = 1     ; keep the camera in front of walls the game pulled it in for
reset_distance   = 500   ; cm moved in one frame that counts as a teleport: snap instead of smoothing
reset_gap        = 0.25  ; s without camera updates (cutscene, free camera, load) before a snap

show_banner      = 1     ; show the preset name and on/off in the game's region banner



; Camera position, written into the game's own camera modes. 100 / 0 / 0 / 0 is the game as shipped.
camera_tuning    = 1     ; 0 puts every camera mode back as the game ships it
; walking and running
exploration_distance = 100   ; percent of the game's distance behind the character
exploration_height = 0     ; cm higher
exploration_shoulder = 0     ; cm further out to the side (centred camera modes are left alone)
exploration_fov  = 0     ; degrees of field of view added
; sprinting
sprint_distance  = 100   ; percent of the game's distance behind the character
sprint_height    = 0     ; cm higher
sprint_shoulder  = 0     ; cm further out to the side (centred camera modes are left alone)
sprint_fov       = 0     ; degrees of field of view added
; combat and focus
combat_distance  = 100   ; percent of the game's distance behind the character
combat_height    = 0     ; cm higher
combat_shoulder  = 0     ; cm further out to the side (centred camera modes are left alone)
combat_fov       = 0     ; degrees of field of view added
; aiming, including on ladders and during claw ride
aiming_distance  = 100   ; percent of the game's distance behind the character
aiming_height    = 0     ; cm higher
aiming_shoulder  = 0     ; cm further out to the side (centred camera modes are left alone)
aiming_fov       = 0     ; degrees of field of view added
; claw ride and anti-grav
traversal_distance = 100   ; percent of the game's distance behind the character
traversal_height = 0     ; cm higher
traversal_fov    = 0     ; degrees of field of view added
game_lag_scale   = 3     ; multiplies the game's own camera lag speeds: higher is tighter
shoulder_swap    = 0     ; 1 puts the camera over the other shoulder
position_transition = 0.5 ; s a position change or shoulder swap glides over; 0 snaps
pitch_min        = -60   ; how far down you can look (the game: -60)
pitch_max        = 40    ; how far up you can look (the game: 40)

; Presets. The mod keeps preset showing the one your settings match, and sets preset_save back to 0.
preset           = 102   ; 0 Custom, 101 Tight, 102 Balanced, 103 Cinematic, 1-10 a slot, 201+ a preset from the config/presets folder: shows the matching preset; change it to load one
preset_save      = 0     ; 1-10: save follow, turning, safety and camera position to that slot

log_stats        = 0     ; every 5 s in UE4SS.log: smoothed frames, mean lag, wall clamp share
