Type = toggle
Label = Stay in front of walls
Description = On: when the game pulls the camera in for a wall, the smoothed camera stays in front of it too. Off: the lag can carry the camera into the wall.
Group = Safety
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/smoothcam.ini
ConfigKey = wall_clamp

[Setting.reset_distance]
Id = reset_distance
Type = integer
Label = Teleport distance
Description = A jump this far in one frame counts as a teleport, and the camera snaps to your character instead of gliding.
Group = Safety
Minimum = 100
Maximum = 3000
Step = 50
Decimals = 0
Default = 500
Suffix = cm
ConfigFile = config/smoothcam.ini
ConfigKey = reset_distance

[Setting.reset_gap]
Id = reset_gap
Type = slider
Label = Snap after a pause of
Description = After cutscenes, the free camera or a load, the camera snaps back instead of gliding if it has been away this long.
Group = Safety
Minimum = 0.05
Maximum = 2
Step = 0.05
Decimals = 2
Default = 0.25
Suffix = s
ConfigFile = config/smoothcam.ini
ConfigKey = reset_gap

