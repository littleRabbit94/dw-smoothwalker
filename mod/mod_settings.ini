Type = slider
Label = Turning follow speed
Description = How quickly smoothed turning catches up with your input. Higher is more responsive.
Group = Rotation
Minimum = 1
Maximum = 60
Step = 1
Decimals = 0
Default = 20
ConfigFile = config/smoothwalker.ini
ConfigKey = rotation_rate

