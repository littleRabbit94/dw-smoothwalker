ConfigFile = config/smoothcam.ini
ConfigKey = max_lag_v

[Setting.soft_leash]
Id = soft_leash
Type = toggle
Label = Soft lag limit
Description = On: the camera eases into the lag limit. Off: it stops hard at the limit, which can feel rigid at a steady run.
Group = Follow
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/smoothcam.ini
ConfigKey = soft_leash

[Setting.catchup_distance]
Id = catchup_distance
Type = integer
Label = Full-speed distance
Description = For the non-constant curves: how far behind the camera must be before it catches up at full speed.
Group = Follow
Minimum = 10
Maximum = 500
Step = 10
Decimals = 0
Default = 150
Suffix = cm
ConfigFile = config/smoothcam.ini
ConfigKey = catchup_distance

[Setting.min_rate_scale]
Id = min_rate_scale
Type = slider
Label = Gentle-start strength
Description = For the non-constant curves: the catch-up speed when the camera is barely behind, as a share of the full speed. Lower is floatier.
Group = Follow
Minimum = 0.05
Maximum = 1
Step = 0.05
Decimals = 2
Default = 0.35
Prefix = x
ConfigFile = config/smoothcam.ini
ConfigKey = min_rate_scale

[Setting.rotation_smoothing]
Id = rotation_smoothing
Type = toggle
Label = Smooth turning
Description = On: turning the camera is smoothed too. This adds a little delay to aiming. Off: turning follows your input exactly.
Group = Rotation
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config/smoothcam.ini
ConfigKey = rotation_smoothing

[Setting.rotation_rate]
Id = rotation_rate
