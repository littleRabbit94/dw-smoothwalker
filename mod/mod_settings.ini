; Settings page for the Dawnwalker Mod Menu (Nexus 271). The menu reads this file once per game session.
; At startup, before that, DWSmoothwalker rewrites the PresetValues and PresetLabels lines of
; [Setting.preset]: saved slots under their names, the presets in config/presets, then the empty
; slots. Everything else here is left as shipped.
; Apply rewrites the matching numbers in config/smoothwalker.ini, and the mod picks the change up
; within a quarter second: no callback needed. The mod applies only the numbers that changed, and writes
; its own changes (a key press, the Preset indicator) back to that file only while the camera is live, so
; never behind an open page. A preset load from this page is written as soon as the menu closes, so a page
; reopened from the pause menu shows the loaded values.
;
; Only numeric keys can go here, so the three key names are missing. Every ConfigKey below must
; exist exactly once in smoothwalker.ini with a value inside its range, or the whole page fails to open.

[Mod]
Id = DWSmoothwalker
Name = Smoothwalker
Author = littleRabbit6
Version = 0.8.0
Description = A smoother third-person camera. The camera trails your character instead of being locked to it, while turning stays instant. V swaps shoulders. Changes apply as soon as you press Apply.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Smoothwalker
Description = On: the camera follows your character smoothly, and the game's own slight camera lag is switched off so the Follow settings below are the only lag. Off: the game's own camera, as if the mod were not installed: no follow, no camera position changes, and the preset and shoulder keys do nothing.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/smoothwalker.ini
ConfigKey = enabled

[Setting.show_banner]
Id = show_banner
Type = toggle
Label = Show banners
Description = On: loading or cycling a preset, saving a slot, or switching Smoothwalker on or off with a key shows a short banner at the top of the screen. Quick presses show one banner with the last name. Off: no banners.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/smoothwalker.ini
ConfigKey = show_banner

[Setting.preset]
Id = preset
Type = picker
Label = Preset
Description = Shows which preset your settings match, or Custom when none does. Pick one and press Apply to load it. Tight: barely trails, with the camera a little closer. Balanced (the default): a clear trail that settles fast, with the game's own camera position. Cinematic: a heavy, slow trail with smoothed turning, the camera pulled back, higher and wider. A preset sets follow, turning, the look limits and camera position, but not On/off, Follow while aiming, Position change speed, Adjust camera position, Other shoulder, banners, Log statistics or keys. Your saved slots come first, then presets from the config/presets folder, then the empty slots. Picking a slot marked (empty) saves a copy of your current settings there instead of loading. Picking a saved slot loads it. While a slot is the preset shown here, every Apply saves your changes into it, so there is no separate save step. Pick Custom to stop saving into a slot. The built-in presets and the ones from the presets folder never change: edit one and your settings become Custom. After a load, leave the menu and come back to see the loaded values. To name a slot, change the name line in config/presets/Slot N.ini; the new name shows after the next game start.
Group = Presets
PresetValues = 0|101|102|103|1|2|3|4|5|6
PresetLabels = Custom|Tight|Balanced|Cinematic|Slot 1 (empty)|Slot 2 (empty)|Slot 3 (empty)|Slot 4 (empty)|Slot 5 (empty)|Slot 6 (empty)
Default = 102
ConfigFile = config/smoothwalker.ini
ConfigKey = preset

[Setting.follow_rate_h]
Id = follow_rate_h
Type = slider
Label = Horizontal follow speed
Description = How quickly the camera catches up as you move sideways and forwards. Lower is floatier.
Group = Follow
Minimum = 0.5
Maximum = 30
Step = 0.5
Decimals = 1
Default = 6.5
ConfigFile = config/smoothwalker.ini
ConfigKey = follow_rate_h

[Setting.curve_h]
Id = curve_h
Type = picker
Label = Horizontal catch-up curve
Description = How the catch-up speed changes with distance. Constant keeps one speed. The others start gently and speed up as the camera falls further behind.
Group = Follow
PresetValues = 0|1|2|3
PresetLabels = Constant|Linear|Smoothstep|Ease in-out
Default = 2
ConfigFile = config/smoothwalker.ini
ConfigKey = curve_h

[Setting.max_lag_h]
Id = max_lag_h
Type = integer
Label = Horizontal lag limit
Description = The furthest the camera may fall behind horizontally.
Group = Follow
Minimum = 0
Maximum = 300
Step = 5
Decimals = 0
Default = 85
Suffix = cm
ConfigFile = config/smoothwalker.ini
ConfigKey = max_lag_h

[Setting.follow_rate_v]
Id = follow_rate_v
Type = slider
Label = Vertical follow speed
Description = How quickly the camera catches up when you jump, fall or climb.
Group = Follow
Minimum = 0.5
Maximum = 30
Step = 0.5
Decimals = 1
Default = 10
ConfigFile = config/smoothwalker.ini
ConfigKey = follow_rate_v

[Setting.curve_v]
Id = curve_v
Type = picker
Label = Vertical catch-up curve
Description = How the vertical catch-up speed changes with distance.
