Minimum = 0.05
Maximum = 1
Step = 0.05
Decimals = 2
Default = 0.35
Suffix = x
ConfigFile = config/smoothwalker.ini
ConfigKey = min_rate_scale

[Setting.soft_leash]
Id = soft_leash
Type = toggle
Label = Soft lag limit
Description = On: the camera eases into the lag limit. Off: it stops hard at the limit, which can feel rigid at a steady run.
Group = Follow
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config/smoothwalker.ini
ConfigKey = soft_leash

[Setting.aiming_follow]
Id = aiming_follow
Type = integer
Label = Follow while aiming
Description = How much of the trail and the turning smoothing stays while you aim. 0: the camera is locked to your aim. 100: aiming trails like everything else. It eases in and out as you raise and lower your aim. Not part of a preset.
Group = Follow
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 30
Suffix = %
ConfigFile = config/smoothwalker.ini
ConfigKey = aiming_follow

[Setting.rotation_smoothing]
Id = rotation_smoothing
Type = toggle
Label = Smooth turning
Description = On: turning the camera is smoothed too. This adds a little delay to aiming. Off: turning follows your input exactly.
Group = Rotation
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config/smoothwalker.ini
ConfigKey = rotation_smoothing

[Setting.rotation_rate]
