; Smoothwalker example preset: Over the Shoulder. A closer camera set further out over the shoulder,
; with a quicker, shorter follow than Balanced (a close camera shows every cm of trail) and more room
; to look up and down.
;
; To make your own, copy this file into the same folder under a new name, change the name line and
; the values, and restart the game. Any key can be left out; loading the preset then leaves that
; setting as the player has it. Ranges and shipped defaults are in brackets.

name = Over the Shoulder

; Follow
follow_rate_h = 12         ; horizontal catch-up per second [0.5 to 30, 6.5]
follow_rate_v = 14         ; vertical catch-up per second [0.5 to 30, 10]
curve_h = 2                ; 0 constant, 1 linear, 2 smoothstep, 3 ease in-out [2]
curve_v = 0                ; [0]
catchup_distance = 150     ; cm of lag at which a curve reaches full speed [10 to 500, 150]
min_rate_scale = 0.35      ; speed share when barely behind, curves 1 to 3 [0.05 to 1, 0.35]
max_lag_h = 40             ; cm the camera may fall behind horizontally; 0 is no trail [0 to 300, 85]
max_lag_v = 30             ; cm vertically; 0 is no trail [0 to 200, 50]
soft_leash = 1             ; 1 eases into the lag limit, 0 stops hard [1]
aiming_follow = 30         ; percent of the trail and turning smoothing kept while aiming [0 to 100, 30]
combat_follow = 100        ; percent of the trail kept while a combat camera is up [0 to 100, 100]

; Turning
rotation_smoothing = 0     ; 1 smooths turning too; while aiming or in combat the aiming_follow / combat_rotation settings scale it back [0]
rotation_rate = 20         ; turning catch-up when smoothed [1 to 60, 20]
combat_rotation = 100      ; percent of the turning smoothing kept while a combat camera is up [0 to 100, 100]

; Camera, all modes
pitch_min = -70            ; how far down you can look while exploring and sprinting [-89 to -30, -60]
pitch_max = 50             ; how far up [20 to 89, 40]

; Per situation. distance: % of the game's [25 to 250, 100]. height: cm [-50 to 100, 0].
; shoulder: cm further out to the side [-60 to 100, 0]. fov: degrees added [-30 to 30, 0].
exploration_distance = 75
exploration_height = 5
exploration_shoulder = 25
exploration_fov = 0

sprint_distance = 90
sprint_height = 5
sprint_shoulder = 20
sprint_fov = 5

combat_distance = 100
combat_height = 0
combat_shoulder = 10
combat_fov = 0

focus_distance = 100
focus_height = 0
focus_shoulder = 10
focus_fov = 0

aiming_distance = 90
aiming_height = 0
aiming_shoulder = 15
aiming_fov = 0

traversal_distance = 100   ; claw ride and anti-grav; no shoulder key here
traversal_height = 0
traversal_fov = 0
