; SmoothCam example preset: Over the Shoulder. A closer camera set further out over the shoulder,
; with a slightly quicker follow than Balanced and more room to look up and down.
;
; To make your own, copy this file into the same folder under a new name, change the name line and
; the values, and restart the game. Any key can be left out; loading the preset then leaves that
; setting as the player has it. Ranges and shipped defaults are in brackets.

name = Over the Shoulder

; Follow
follow_rate_h = 10         ; horizontal catch-up per second [0.5 to 30, 8]
follow_rate_v = 12         ; vertical catch-up per second [0.5 to 30, 10]
curve_h = 2                ; 0 constant, 1 linear, 2 smoothstep, 3 ease in-out [2]
curve_v = 0                ; [0]
catchup_distance = 150     ; cm of lag at which a curve reaches full speed [10 to 500, 150]
min_rate_scale = 0.35      ; speed share when barely behind, curves 1 to 3 [0.05 to 1, 0.35]
max_lag_h = 50             ; cm the camera may fall behind horizontally [0 to 300, 70]
max_lag_v = 40             ; cm vertically [0 to 200, 50]
soft_leash = 1             ; 1 eases into the lag limit, 0 stops hard [1]

; Turning and walls
rotation_smoothing = 0     ; 1 smooths turning too, which delays aiming a little [0]
rotation_rate = 20         ; turning catch-up when smoothed [1 to 60, 20]
wall_clamp = 1             ; keep the camera in front of walls [1]

; Snaps
reset_distance = 500       ; cm moved in one frame that counts as a teleport [100 to 3000, 500]
reset_gap = 0.25           ; s without camera updates before a snap [0.05 to 2, 0.25]

; Camera, all modes
game_lag_scale = 1         ; multiplies the game's own camera lag speeds [1 to 20, 1]
position_transition = 0.5  ; s a position change glides over, 0 snaps [0 to 2, 0.5]
pitch_min = -70            ; how far down you can look while exploring and sprinting [-89 to -30, -60]
pitch_max = 50             ; how far up [20 to 89, 40]

; Per situation. distance: % of the game's [50 to 250, 100]. height: cm [-50 to 100, 0].
; shoulder: cm further out to the side [-60 to 100, 0]. fov: degrees added [-30 to 30, 0].
exploration_distance = 85
exploration_height = 5
exploration_shoulder = 25
exploration_fov = 0

sprint_distance = 95
sprint_height = 5
sprint_shoulder = 20
sprint_fov = 5

combat_distance = 100
combat_height = 0
combat_shoulder = 10
combat_fov = 0

aiming_distance = 90
aiming_height = 0
aiming_shoulder = 15
aiming_fov = 0

traversal_distance = 100   ; claw ride and anti-grav; no shoulder key here
traversal_height = 0
traversal_fov = 0
